name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          package-manager-cache: false
      - run: npm install --legacy-peer-deps
      - run: ./scripts/check-contracts.sh
      - run: npm -w packages/drive-sync run build
      - run: npm -w packages/drive-connect run test
