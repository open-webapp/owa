name: Publish packages

on:
  push:
    tags:
      - 'drive-sync-v*'
      - 'project-sync-v*'
      - 'drive-connect-v*'
      - 'calendar-v*'
      - 'notes-core-v*'
  workflow_dispatch:
    inputs:
      calendar_tag:
        description: 'Existing calendar release tag to publish'
        required: true
        default: 'calendar-v0.11.1'
        type: string

permissions:
  id-token: write  # Required for OIDC
  contents: read
  
jobs:
  publish-drive-sync:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/drive-sync-v')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false  # never use caching in release builds
      # --legacy-peer-deps: known ERESOLVE in this repo (project-sync peer @open-webapp/drive-sync ^0.5.0 vs workspace 0.6.0); plain npm install fails
      - run: npm install --legacy-peer-deps
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm -w packages/drive-sync run build
      - run: npm -w packages/drive-sync run test
      - run: npm publish --access public --provenance --workspace packages/drive-sync
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-project-sync:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/project-sync-v')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false  # never use caching in release builds
      # --legacy-peer-deps: known ERESOLVE in this repo (project-sync peer @open-webapp/drive-sync ^0.5.0 vs workspace 0.6.0); plain npm install fails
      - run: npm install --legacy-peer-deps
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm -w packages/drive-sync run build
      - run: npm -w packages/project-sync run build
      - run: npm -w packages/project-sync run test
      - run: npm publish --access public --provenance --workspace packages/project-sync
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-drive-connect:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/drive-connect-v')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false  # never use caching in release builds
      # --legacy-peer-deps: known ERESOLVE in this repo (project-sync peer @open-webapp/drive-sync ^0.5.0 vs workspace 0.6.0); plain npm install fails
      - run: npm install --legacy-peer-deps
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm -w packages/drive-sync run build
      - run: npm -w packages/drive-connect run build
      - run: npm -w packages/drive-connect run test
      - run: npm publish --access public --provenance --workspace packages/drive-connect
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-calendar:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/calendar-v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.calendar_tag || github.ref }}
      - name: Verify calendar release tag
        env:
          RELEASE_TAG: ${{ inputs.calendar_tag || github.ref_name }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const pkg = JSON.parse(fs.readFileSync("packages/calendar/package.json", "utf8"));
            if (process.env.RELEASE_TAG !== `calendar-v${pkg.version}`) {
              throw new Error("Release tag must match the calendar package version");
            }
          '
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false  # never use caching in release builds
      # --legacy-peer-deps: known ERESOLVE in this repo (project-sync peer @open-webapp/drive-sync ^0.5.0 vs workspace 0.6.0); plain npm install fails
      - run: npm install --legacy-peer-deps
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm -w packages/calendar run build
      - run: npm -w packages/calendar run test
      - name: Check npm token identity
        continue-on-error: true
        run: npm whoami --registry=https://registry.npmjs.org/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Inspect calendar trusted publishers
        continue-on-error: true
        run: npm trust list @open-webapp/calendar
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish --access public --provenance --workspace packages/calendar --loglevel verbose
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-notes-core:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/notes-core-v')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false  # never use caching in release builds
      # --legacy-peer-deps: known ERESOLVE in this repo (project-sync peer @open-webapp/drive-sync ^0.5.0 vs workspace 0.6.0); plain npm install fails
      - run: npm install --legacy-peer-deps
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm -w packages/notes-core run build
      - run: npm -w packages/notes-core run test
      - run: npm publish --access public --provenance --workspace packages/notes-core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
