name: Publish packages

on:
  push:
    tags:
      - 'drive-sync-v*'
      - 'project-sync-v*'
      - 'drive-connect-v*'

permissions:
  id-token: write  # Required for OIDC
  contents: read
  
jobs:
  publish-drive-sync:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/drive-sync-v')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false  # never use caching in release builds
      - run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm -w packages/drive-sync run build
      - run: npm -w packages/drive-sync run test || true
      - run: npm publish --access public --provenance --workspace packages/drive-sync
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-project-sync:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/project-sync-v')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false  # never use caching in release builds
      - run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm -w packages/drive-sync run build
      - run: npm -w packages/project-sync run build
      - run: npm -w packages/project-sync run test || true
      - run: npm publish --access public --provenance --workspace packages/project-sync
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-drive-connect:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/drive-connect-v')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false  # never use caching in release builds
      # --legacy-peer-deps: known ERESOLVE in this repo (project-sync peer @open-webapp/drive-sync ^0.5.0 vs workspace 0.6.0); plain npm install fails
      - run: npm install --legacy-peer-deps
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm -w packages/drive-sync run build
      - run: npm -w packages/drive-connect run build
      - run: npm -w packages/drive-connect run test || true
      - run: npm publish --access public --provenance --workspace packages/drive-connect
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
